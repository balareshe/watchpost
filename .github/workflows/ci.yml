name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端语法与冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法检查
        run: |
          python -m py_compile server/app.py server/watch.py collector/collect.py
      - name: 启动 API 冒烟
        run: |
          mkdir -p /tmp/data
          ADMIN_TOKEN=test-token python server/app.py &
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/health)
          echo "health=$code"
          test "$code" = "200"
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/users)
          echo "anon users=$anon"
          test "$anon" = "401"
        env:
          DATA_FILE: /tmp/data/status-data.json

  frontend:
    name: 后台构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-app/package-lock.json
      - name: 安装依赖
        working-directory: admin-app
        run: npm ci
      - name: 构建
        working-directory: admin-app
        run: npm run build
      - name: 校验产物
        run: test -f web/admin/index.html

  compose:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_TOKEN=.*/ADMIN_TOKEN=ci-test-token/' .env
          docker compose config >/dev/null
